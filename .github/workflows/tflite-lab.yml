name: tflite-lab

# Does the static INT8 failure, and Anneal's equalisation fix, carry over from onnxruntime to
# TFLite / XNNPACK? Converts once on x86, then evaluates on ARM, x86 and Apple silicon.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "comma-separated torchvision models"
        default: "efficientnet_b0,mobilenet_v3_large,mobilenet_v2,resnet50"
      eval_limit:
        description: "Imagenette validation images"
        default: "1024"

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . tensorflow onnx2tf onnx_graphsurgeon sng4onnx onnxsim psutil tf_keras ai-edge-litert
      - uses: actions/cache@v4
        with:
          path: ~/.anneal_cache
          key: imagenette2-160
      - name: Convert
        run: python examples/tflite_lab/run_tflite.py convert --models "${{ inputs.models }}" --out tflite-models
      - uses: actions/upload-artifact@v4
        with:
          name: tflite-models
          path: tflite-models/*.tflite

  evaluate:
    needs: convert
    name: evaluate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . py-cpuinfo ai-edge-litert || python -m pip install -e . py-cpuinfo tensorflow
      - uses: actions/cache@v4
        with:
          path: ~/.anneal_cache
          key: imagenette2-160
      - uses: actions/download-artifact@v4
        with:
          name: tflite-models
          path: tflite-models
      - name: Evaluate
        shell: bash
        run: |
          python examples/tflite_lab/run_tflite.py evaluate --models "${{ inputs.models }}" \
            --models-dir tflite-models --limit "${{ inputs.eval_limit }}" --out "tflite-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tflite-${{ matrix.os }}
          path: tflite-${{ matrix.os }}.json
